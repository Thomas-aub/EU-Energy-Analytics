<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Électrique - Détail par Pays</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <header>
        <h1>Explorez l'Électricité Européenne</h1>
        <nav class="main-nav">
            <ul>
                <li><a href="../europe_complete/europe_complete.html">Carte & Données</a></li>
                <li><a href="production.html" class="active">Production</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="filter-group">
                <label for="countrySelect">Choisir un pays</label>
                <select id="countrySelect"></select>
            </div>

            <div class="filter-group">
                <label>Sources d'énergie</label>
                <div id="source-checklist" class="checklist"></div>
                <button id="selectAllBtn">Tout cocher / décocher</button>
            </div>

            <div style="display: flex; align-items: center; gap: 8px; margin-top: 20px;">
                <input type="checkbox" id="finalConsumptionChk" style="cursor: pointer;">
                <label for="finalConsumptionChk" style="cursor: pointer; margin: 0;">
                    Afficher le Total
                </label>
            </div>
        </aside>

        <main class="content">
            <div class="stats-grid">
                <div class="stat-card border-green">
                    <h4>Part Décarbonée</h4>
                    <div class="stat-value" id="stat-carbon-free">-</div>
                    <div class="stat-sub" id="stat-carbon-free-sub">en 2023</div>
                </div>
                
                <div class="stat-card border-purple">
                    <h4>Intensité Carbone</h4>
                    <div class="stat-value" id="stat-intensity">-</div>
                    <div class="stat-sub" id="stat-top-source-sub"></div>
                </div>

                <div class="stat-card border-blue">
                    <h4>Source Principale</h4>
                    <div class="stat-value" id="stat-top-source" style="font-size: 1.5rem;">-</div>
                    <div class="stat-sub" id="stat-top-share">-</div>
                </div>
            </div>

            <h2 id="chartTitle"></h2>
            <div id="chart"></div>
            <div id="loader">Chargement des données...</div>
        </main>
    </div>
    </main>
    </div>

    <footer style="text-align: center; padding: 20px; color: #666; font-size: 0.9rem;">
        <p>Source des données : 
            <a href="https://ourworldindata.org/grapher/electricity-prod-source-stacked?country=~OWID_EUR" target="_blank" rel="noopener noreferrer">
                Our World in Data (Electricity Production by Source)
            </a>
        </p>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>

    <script src="./js/script.js"></script>
</body>
</html>
