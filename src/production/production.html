<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorez l'Électricité Européenne</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <header>
        <h1>Explorez l'Électricité Européenne</h1>
        <nav class="main-nav">
            <ul>
                <li><a href="../index.html">Accueil</a></li>
                <li><a href="production.html" class="active">Production</a></li>
                <li><a href="../europe_complete/europe_complete.html">Carte et données</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="filter-group">
                <label for="countrySelect">Choisir un pays</label>
                <select id="countrySelect"></select>
            </div>

            <div class="filter-group">
                <label>Energy Sources</label>
                <div id="source-checklist" class="checklist"></div>
                <button id="selectAllBtn" class="btn">Toggle All</button>
            </div>

            <div id="finalConsumptionContainer"
                style="display:none; align-items: center; gap: 8px; white-space: nowrap;">
                <input type="checkbox" id="finalConsumptionChk" style="margin: 0; cursor: pointer;">
                <label for="finalConsumptionChk"
                    style="cursor: pointer; font-weight: bold; margin: 0; display: inline-block;">
                    Afficher la production totale
                </label>
            </div>
        </aside>

        <main class="content">
            <h2 id="chartTitle" style="text-align: center;"></h2>
            <div id="chart"></div>
            <div id="loader" class="status">Loading CSV data...</div>
        </main>
    </div>

    <script src="./js/script.js"></script>
</body>

</html>
